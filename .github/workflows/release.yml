name: Release

# Builds a binary for every platform below and attaches them to a GitHub
# Release whenever a version tag (v1.2.3) is pushed, so anyone can download
# a ready-to-run binary from the Releases page with a single click.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # "asset" is what people actually see on the Releases page, so it
        # says which machine the file is for rather than repeating Go's
        # GOOS/GOARCH names ("amd64" reads as AMD-only and "darwin" as
        # anything but macOS, which is exactly the wrong guess).
        include:
          - goos: linux
            goarch: amd64
            asset: pd-status-wall-linux-x86-64
          - goos: linux
            goarch: arm64
            asset: pd-status-wall-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: pd-status-wall-macos-intel
          - goos: darwin
            goarch: arm64
            asset: pd-status-wall-macos-apple-silicon
          - goos: windows
            goarch: amd64
            asset: pd-status-wall-windows.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build dist
          # The binary is always named pd-status-wall inside the archive;
          # the archive filename carries the platform.
          bin="pd-status-wall"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="pd-status-wall.exe"; fi
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "build/${bin}" .

          # macOS and Linux ship as .tar.gz, which preserves the execute
          # bit - a bare binary downloaded over HTTP arrives without it and
          # won't run until the user remembers chmod +x. Windows has no
          # execute bit, so the .exe ships as-is and stays one click.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp "build/${bin}" "dist/${{ matrix.asset }}"
          else
            tar -czf "dist/${{ matrix.asset }}.tar.gz" -C build "${bin}"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
