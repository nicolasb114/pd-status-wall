name: Release

# Builds a binary for every platform below and attaches them to a GitHub
# Release whenever a version tag (v1.2.3) is pushed, so anyone can download
# a ready-to-run binary from the Releases page with a single click.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="pd-status-wall-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags="-s -w" -o "dist/${out}" .
          echo "ARTIFACT=dist/${out}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pd-status-wall-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARTIFACT }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
