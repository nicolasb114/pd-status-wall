<!doctype html>
<html lang="en" data-theme="color">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Video Wall</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="banner" id="banner">
    <img id="banner-img" class="banner-img" alt="" hidden>
    <img id="logo-img" class="logo-img" alt="" hidden>
  </header>

  <main class="wall">
    <section class="overall" id="overall">
      <div class="overall-icon" id="overall-icon" aria-hidden="true"></div>
      <div class="overall-text">
        <h1 id="page-title">Loading status...</h1>
        <p class="overall-sub" id="overall-message"></p>
      </div>
    </section>

    <section class="cards" id="cards" aria-live="polite"></section>

    <section class="buttons" id="buttons"></section>
  </main>

  <footer class="foot" id="updated-at"></footer>

  <div class="corner-actions">
    <button type="button" id="fullscreen-btn" class="corner-btn"
            title="Full screen" aria-label="Enter full screen">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-enter">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-exit">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <a href="/admin" class="corner-btn" title="Admin settings" aria-label="Admin settings">&#9881;</a>
  </div>

  <template id="tpl-node">
    <div class="node">
      <button class="node-row" type="button">
        <span class="chevron" aria-hidden="true">&#9656;</span>
        <span class="status-dot" aria-hidden="true"></span>
        <span class="node-name"></span>
        <span class="status-label"></span>
      </button>
      <!-- The wrapper exists so expanding can animate: the outer element
           animates grid-template-rows 0fr -> 1fr, which needs a single
           child that can be clipped. display:none can't be transitioned. -->
      <div class="node-children"><div class="node-children-inner"></div></div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
